<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; background: #1a1a2e; color: #eee; font: 13px/1.5 system-ui; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #999; font-size: 11px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .on { background: #50fa7b; color: #08260f; }
  .off { background: #666; color: #eee; }
  .stat { background: #24243e; border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .big { font-size: 22px; font-weight: 800; color: #ff5555; }
  .lbl { color: #999; font-size: 11px; }
  .foot { margin-top: 12px; color: #777; font-size: 10px; }
  #langBtn { background: #24243e; color: #9fd0ff; border: 0; border-radius: 6px; padding: 3px 10px; font: 11px system-ui; cursor: pointer; font-weight: 700; }
</style>
</head>
<body>
  <div class="row" style="margin:0 0 4px">
    <h1 style="margin:0">🤐 <span id="t_title">守口如瓶过滤器</span></h1>
    <button id="langBtn">EN</button>
  </div>
  <div class="sub" id="t_sub"></div>
  <div class="row">
    <span id="t_protect">实时保护</span>
    <span class="badge on" id="st">RUNNING</span>
  </div>
  <div class="row">
    <span id="t_engine">检测引擎</span>
    <span id="engine" style="font-weight:700"></span>
  </div>
  <div class="stat">
    <div class="big" id="cnt">0</div>
    <div class="lbl" id="t_stat"></div>
  </div>
  <div class="foot" id="t_foot"></div>
  <script src="popup.js"></script>
</body>
</html>
