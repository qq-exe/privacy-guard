<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>AI Logic 连通性测试</title></head>
<body style="font:14px monospace;white-space:pre-wrap;background:#111;color:#9f9;padding:20px">
<div id="out">测试中…</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAI, getGenerativeModel } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js';
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js';
self.FIREBASE_APPCHECK_DEBUG_TOKEN = '6c1f3a2b-9d4e-4f8a-b7c2-1d3e5f7a9b11';
const cfg = { apiKey: 'AIzaSyApixx2TAWIfBV-cfj2mwoxhkL-z1ji5W8', authDomain: 'privacy-guard-ab2b1.firebaseapp.com', projectId: 'privacy-guard-ab2b1', storageBucket: 'privacy-guard-ab2b1.firebasestorage.app', messagingSenderId: '116500378057', appId: '1:116500378057:web:6b15d9a50ec936095e3818' };
const out = document.getElementById('out');
try {
  const app = initializeApp(cfg);
  out.textContent += '\n[1] app initialized';
  initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider('debug-key-not-validated'), isTokenAutoRefreshEnabled: true });
  const ai = getAI(app);
  out.textContent += '\n[2] AI instance ok';
  const model = getGenerativeModel(ai, { model: 'gemini-2.5-flash' });
  out.textContent += '\n[3] model ok, calling…';
  const res = await model.generateContent('只输出 JSON:{"ok":true}');
  const txt = res.response.text();
  out.textContent += '\n[SUCCESS] response: ' + txt.slice(0, 200);
} catch (e) {
  out.textContent += '\n[ERROR] ' + (e.message || e).slice(0, 500) + '\n[code] ' + (e.code || 'n/a');
}
</script>
</body>
</html>
